name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (exact versions from uv.lock)
        run: uv sync --extra dev --locked
      - name: Tests (no network)
        run: uv run pytest
      - name: requirements.txt matches pyproject.toml
        run: |
          uv pip compile pyproject.toml --extra dev --python-version 3.12 --quiet -o /tmp/requirements.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
