# Which models D1 uses. Changing a model here changes results, so every
# reported run records a hash of this file.

# Writes the synthetic company charts. Must differ from mapping_model,
# so the mapper is never tested on text written by itself.
generator_model: claude-opus-5-5

# The LLM method: picks among the top-k candidates (and, in the cascade,
# handles low-confidence accounts of the winning method).
mapping_model: claude-haiku-5-5

# Writes the one-line descriptions of the 190 standard groups (Task 2.6).
# Must differ from generator_model: Opus wrote the LLM accounts, and its own
# wording would match its own accounts.
description_model: claude-sonnet-5-5

# How LLM calls are made:
#   claude_cli    - through the `claude` command, on your own Claude login (default)
#   anthropic_api - through the Anthropic API, needs ANTHROPIC_API_KEY
llm_backend: claude_cli

# Multilingual sentence-embedding model for retrieval. Chosen on the dev split
# among embedding_candidates by the highest recall@k (87.0%, against 82.8% for
# e5-base and 71.1% for mpnet): see reports/embedding_selection.md and
# notebooks/08_embedding_selection.ipynb.
embedding_model: BAAI/bge-m3
embedding_candidates:
  - intfloat/multilingual-e5-base
  - BAAI/bge-m3
  - sentence-transformers/paraphrase-multilingual-mpnet-base-v2

# USD per million tokens, used for the cost-per-1,000-accounts report.
llm_prices_per_mtok:
  claude-haiku-5-5: {input: 0.10, output: 0.50}

# Account-mapping method comparison (Phase 3). Every method chooses among the
# same top-k embedding candidates, is calibrated on dev and judged on the
# auto-mapped share at the target precision.
mapping:
  candidates_k: 10              # Laya works best with fewer than ~20 options
  target_precision: 0.98
  methods: [fuzzy, embeddings, xgboost, random_forest, laya, llm]
  laya_model: convaiinnovations/laya-multilingual
  selected_method: null         # set after the comparison on dev (Task 3.5)
  # What each standard group is compared with: names, descriptions (names plus
  # its description) or average (the mean of both scores). Chosen on dev:
  # recall@10 87.0% -> 91.9%, embeddings baseline auto-maps 23.0% -> 32.6% at
  # 98% (notebooks/12_group_descriptions.ipynb).
  group_text: average
